<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — DataLens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <header class="app-navbar d-flex align-items-center">
        <div class="container d-flex align-items-center justify-content-between">
            <a class="navbar-brand" href="/">
                <span class="brand-icon"><i data-lucide="bar-chart-2" style="width: 15px; height: 15px;"></i></span>
                <span>DataLens</span>
            </a>
            <div>
                <a href="/" class="btn btn-secondary-custom btn-sm-custom">Home</a>
            </div>
        </div>
    </header>

    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 text-center">
                <div class="custom-card p-5">
                    <div class="text-secondary mb-3" style="font-size: 2.2rem; color: var(--warning) !important;">
                        <i class="bi bi-exclamation-circle"></i>
                    </div>
                    <h1 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 6px;">{{ error_title or "Notice" }}</h1>
                    <p class="text-secondary mb-4" style="font-size: 0.88rem;">
                        {{ error_message or "An unexpected issue occurred while processing your request. Please try again." }}
                    </p>
                    <div class="d-flex justify-content-center gap-2">
                        <a href="/upload" class="btn btn-primary btn-sm-custom">
                            Upload Dataset
                        </a>
                        <a href="/" class="btn btn-secondary-custom btn-sm-custom">
                            Return Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="app-footer mt-auto">
        <div class="container text-center">
            <span>&copy; 2026 DataLens</span>
        </div>
    </footer>
    <script>
        if (window.lucide) { lucide.createIcons(); }
    </script>
</body>
</html>
